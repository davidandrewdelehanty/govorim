[package]
name = "govorim"
version = "1.0.0"
description = "Govorim — Russian reading, offline"
edition = "2021"

[lib]
name = "govorim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
mime_guess = "2"
ureq = { version = "2", features = ["json"] }
rust-embed = "8"
urlencoding = "2"

[profile.release]
strip = true
lto = true
opt-level = "s"
